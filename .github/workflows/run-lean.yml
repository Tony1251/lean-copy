name: Run Lean Backtest (Docker)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Results Directory
        run: mkdir -p backtests

      - name: Run Lean in Docker
        run: |
          docker run --rm \n            -v $(pwd):/Lean \n            -w /Lean \n            quantconnect/lean:latest \n            dotnet Launcher/bin/Debug/QuantConnect.Lean.Launcher.dll --algorithm BasicTemplateAlgorithm --language CSharp

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backtest-Results
          path: backtests/