name: Run Lean Backtest (CLI)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lean CLI
        run: pip install lean

      - name: Initialize Lean and Run Backtest
        run: |
          # Initialize a lean workspace if not present
          lean init --non-interactive
          # Run the basic template algorithm included in the repo
          # We point to the Python version as it's often easier to bootstrap in CLI
          lean backtest "Algorithm.Python/BasicTemplateAlgorithm.py" --output backtests

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backtest-Results
          path: backtests/