name: Run Lean Backtest (CLI Fixed)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lean CLI
        run: pip install lean

      - name: Run Lean Backtest
        run: |
          # lean init creates a basic setup if it doesn't exist
          # Using yes to answer prompts if any
          yes "" | lean init
          # Run backtest on the Python algorithm
          lean backtest "Algorithm.Python/BasicTemplateAlgorithm.py" --output backtests

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backtest-Results
          path: backtests/